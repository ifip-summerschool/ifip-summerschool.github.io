name: "22nd IFIP Summer School on Privacy and Identity Management"
title: "22nd IFIP Summer School"
title_separator: "-"
subtitle: "on Privacy and Identity Management (August 9-13, 2027, Sankt Valentin, Germany)"
description: >- # this means to ignore newlines until "baseurl:"
  Website for IFIP Summer School on Privacy and Identity Management.
minimal_mistakes_skin: default
search: false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# TZ needed?
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

plugins:
  - jekyll-include-cache

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/company/ifip-summerschool"
    - label: "Privacy Policy"
      url: "/privacy_policy/"


atom_feed:
  hide: true

defaults:
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
